; RicinoNext receiver (gate): ATmega328PB @ 16 MHz external resonator (MiniCore), next to the ATmega16 decoder.
;   pio run                               build (RS485, default)
;   pio run -t fuses                      first time on a blank chip: 16 MHz external, BOD 2.7 V
;   pio run -t upload                     flash with an USBtinyISP (default programmer)
;   pio run -e rs485-usbasp -t upload     with an USBasp
;   pio run -e rs485-arduinoisp -t upload --upload-port /dev/ttyACM0   Arduino running ArduinoISP
;   pio run -e i2c                        legacy I2C link
; AltSoftSerial 1.4 is vendored in lib/ with the ATmega328PB added (the receivers use a 328PB).
; Programmer on header P1 (ISP of the ATmega328), NEVER on P2 (ATmega16 decoder).
[platformio]
src_dir = RicinoNext-receiver
default_envs = rs485

[env]
platform = atmelavr
board = ATmega328PB
framework = arduino
board_build.f_cpu = 16000000L
board_hardware.oscillator = external
board_hardware.bod = 2.7v
upload_protocol = usbtiny
upload_flags = -e

[env:rs485]
build_flags = -DLINK_RS485=1

[env:rs485-usbasp]
build_flags = -DLINK_RS485=1
upload_protocol = usbasp

[env:rs485-arduinoisp]
build_flags = -DLINK_RS485=1
upload_protocol = stk500v1
upload_speed = 19200

[env:i2c]
build_flags = -DLINK_RS485=0
