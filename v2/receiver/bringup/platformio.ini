; RS485 bring-up test for the receiver (ATmega328PB), see rs485-bringup.ino.
;   uvx platformio run -t upload                 (USBtinyISP on P1): T21/G21 test, RX = PD0, TX = PB1, LED = PD2
;   uvx platformio run -e pintest -t upload      TX pin test: PB1 low 1 s / high 1 s
[platformio]
src_dir = rs485-bringup
default_envs = bringup

[env:bringup]
platform = atmelavr
board = ATmega328PB
framework = arduino
board_build.f_cpu = 16000000L
board_hardware.oscillator = external
board_hardware.bod = 2.7v
upload_protocol = usbtiny
upload_flags = -e

[env:pintest]
platform = atmelavr
board = ATmega328PB
framework = arduino
board_build.f_cpu = 16000000L
board_hardware.oscillator = external
board_hardware.bod = 2.7v
build_flags = -DPIN_TEST=1
upload_protocol = usbtiny
upload_flags = -e
