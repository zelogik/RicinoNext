; RS485 bring-up test with the Arduino libraries (see rs485-bringup-lib.ino), ATmega328PB.
;   uvx platformio run -t upload                  TX with SoftwareSerial (default)
;   uvx platformio run -e altsoft -t upload       TX with AltSoftSerial
[platformio]
src_dir = rs485-bringup-lib
default_envs = softserial

[env]
platform = atmelavr
board = ATmega328PB
framework = arduino
board_build.f_cpu = 16000000L
board_hardware.oscillator = external
board_hardware.bod = 2.7v
upload_protocol = usbtiny
upload_flags = -e

[env:softserial]
build_flags = -DUSE_ALTSOFT=0

[env:altsoft]
build_flags = -DUSE_ALTSOFT=1
lib_extra_dirs = ../lib
