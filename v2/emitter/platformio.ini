; RicinoNext emitter: plain avr-gcc (no Arduino core), ISP programmer on the emitter header.
;   pio run                      build (ATtiny24, the emitter PCB)
;   pio run -t fuses             once per chip, BEFORE the first upload: 8 MHz, BOD 2.7 V, EEPROM kept
;   pio run -t upload            flash (the ID in EEPROM is kept once the fuses are set)
;   pio run -e attiny84 ...      other chips: attiny44, attiny84, attiny85
[platformio]
default_envs = attiny24

[env]
platform = atmelavr
board_build.f_cpu = 8000000L
build_flags = -Wall -Wextra
upload_protocol = usbtiny
upload_flags = -e
; lfuse 0xE2: internal 8 MHz, no /8 · hfuse 0xD5: SPI on, EESAVE (chip erase keeps the ID), BOD 2.7 V
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xD5
board_fuses.efuse = 0xFF

[env:attiny24]
board = attiny24

[env:attiny44]
board = attiny44

[env:attiny84]
board = attiny84

[env:attiny85]
board = attiny85

[env:usbasp]
board = attiny24
upload_protocol = usbasp
